[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-sdk"
version = "0.1.0"
description = "Developer SDK for Enterprise AI Agent Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["platform_sdk"]
